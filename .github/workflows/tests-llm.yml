# Real-endpoint tests. The job is bound to the GitHub Environment `llm`, whose
# required reviewers must approve it before it receives the key and runs: the
# approval hands the key to the code of the pull request, so it comes after
# reading the diff.
#
# `pull_request_target` instead of `pull_request`, because only it passes the
# environment's secrets to pull requests from forks and from Dependabot. It
# takes this file from the base branch, so a pull request cannot change what
# the approval releases. The environment `llm` MUST keep its required
# reviewers: without them every fork pull request would get the key unasked.
name: Tests LLM

on:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

# a new push supersedes the run still waiting for approval; `github.ref` is the
# base branch under `pull_request_target`, hence the number
concurrency:
  group: tests-llm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-llm:
    name: live endpoint
    runs-on: ubuntu-latest
    environment: llm
    env:
      CRA_LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # the variables of the environment `llm` override endpoint and model
      CRA_LLM_BASE_URL: ${{ vars.CRA_LLM_BASE_URL || 'https://openrouter.ai/api/v1' }}
      CRA_LLM_MODEL: ${{ vars.CRA_LLM_MODEL || 'deepseek/deepseek-v4-flash-0731' }}
    steps:
      # without the key every test is skipped and the job would pass
      - name: Require the endpoint key
        run: |
          if [ -z "$CRA_LLM_API_KEY" ]; then
            echo "::error::secret OPENROUTER_API_KEY is not set in the environment llm"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # the commit the reviewer approved, not whatever the branch points
          # to once the job starts
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install tox
      - run: tox -e tests-llm
