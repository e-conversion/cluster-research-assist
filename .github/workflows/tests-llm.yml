# Real-endpoint tests. The job is bound to the GitHub Environment `llm`, whose
# required reviewers must approve it before it receives the secrets and runs.
# Manual only for now: the endpoint and model are not configured yet, so on
# every pull request the job failed without saying anything about the change.
# Put `pull_request:` back once CRA_LLM_BASE_URL and CRA_LLM_MODEL are set.
name: Tests (LLM)

on:
  workflow_dispatch:

jobs:
  tests-llm:
    runs-on: ubuntu-latest
    environment: llm
    env:
      CRA_LLM_API_KEY: ${{ secrets.CRA_LLM_API_KEY }}
      CRA_LLM_BASE_URL: ${{ vars.CRA_LLM_BASE_URL }}
      CRA_LLM_MODEL: ${{ vars.CRA_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install tox
      - run: tox -e tests-llm
