# The gitleaks GitHub Action needs a licence key for organisation repositories;
# the container image does not, so the scanner runs directly.
name: Gitleaks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          git --redact --verbose --exit-code 1 /repo
