name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install tox coverage[toml]
      - run: tox -e tests
      - run: coverage xml
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cra
          POSTGRES_PASSWORD: cra
          POSTGRES_DB: cra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRA_TEST_POSTGRES_URL: postgresql+psycopg://cra:cra@localhost:5432/cra_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install tox
      - run: tox -e tests-postgres
