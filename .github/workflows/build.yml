name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # the query encoder's weights ship in the wheel
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install tox
      - run: tox -e build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
