<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Data pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="js/theme-boot.js"></script>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="../brand/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 400 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  .page { max-width: 100%; margin: 0; padding: 4px 6px 14px; }

  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 500 32px/1.08 var(--display); letter-spacing: -.01em; margin: 10px 0 0; text-wrap: balance; }
  h1 em { font-style: italic; color: var(--ink-2); }
  .lede { color: var(--muted); font-size: 14.5px; margin: 9px 0 0; max-width: 62ch; }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 20px 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 13px; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: calc(3px * var(--radius-scale)); display: inline-block; }
  .reset { margin-left: auto; border: 1px solid var(--hair-2); background: var(--panel); color: var(--ink-2);
    font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: calc(8px * var(--radius-scale)); cursor: pointer; opacity: .5; pointer-events: none; transition: opacity .15s; }
  .reset.on { opacity: 1; pointer-events: auto; }
  .reset:hover { border-color: var(--accent); color: var(--accent); }

  #board { position: relative; margin-top: 14px; }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }

  .band { position: relative; z-index: 1; background: var(--panel); border: 1px solid var(--hair);
    border-left: 3px solid var(--stage); border-radius: calc(11px * var(--radius-scale)); padding: 10px 13px 12px; box-shadow: var(--shadow); }
  .band .bh { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font: 500 11px/1 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .band .bh b { width: 9px; height: 9px; border-radius: calc(2px * var(--radius-scale)); background: var(--stage); display: inline-block; }
  .band .bh .c { margin-left: auto; color: var(--faint); }
  .band .body { display: flex; flex-wrap: wrap; gap: 8px; }
  .glab { flex-basis: 100%; font: 500 9.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 4px 0 -3px; }

  .flow { display: flex; justify-content: center; height: 24px; }
  .flow svg { height: 24px; width: 22px; overflow: visible; }
  .flow line { stroke: var(--hair-2); stroke-width: 2; stroke-dasharray: 2.5 4; stroke-linecap: round; }
  .flow path { fill: var(--hair-2); }

  .node { position: relative; z-index: 1; background: var(--panel); border: 1px solid var(--hair);
    border-radius: calc(9px * var(--radius-scale)); padding: 7px 10px; cursor: pointer; min-width: 150px;
    transition: transform .12s, box-shadow .12s, opacity .16s, border-color .12s; }
  .node:hover { transform: translateY(-1px); border-color: var(--stage); }
  .node .nm { font: 500 12px/1.3 var(--mono); color: var(--ink); word-break: break-word; }
  .node .sb { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  #board.on .node { opacity: .2; }
  #board.on .node.lit { opacity: 1; }
  #board.on .node.focus { opacity: 1; box-shadow: 0 0 0 2px var(--stage), var(--shadow); border-color: var(--stage); }
  #board.on .band { opacity: 1; }
  #board.on .flow { opacity: .12; }
  #board.on .glab, #board.on .bh { opacity: .45; }

  .wire { fill: none; stroke-width: 2; }
  .whead { stroke: none; }

  .detail { margin-top: 16px; background: var(--panel); border: 1px solid var(--hair); border-radius: calc(12px * var(--radius-scale)); padding: 15px 17px; box-shadow: var(--shadow); }
  .detail .dh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .detail .chip { font: 500 10px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: calc(20px * var(--radius-scale)); color: var(--panel); }
  .detail .dn { font: 500 14.5px/1 var(--mono); }
  .detail .dsub { color: var(--faint); font-size: 12.5px; }
  .detail .dd { color: var(--ink-2); margin: 9px 0 0; font-size: 13.5px; max-width: 74ch; }
  .detail .cols { display: flex; gap: 26px; flex-wrap: wrap; margin-top: 12px; }
  .detail .cols > div { flex: 1 1 210px; min-width: 180px; }
  .detail .cols h4 { margin: 0 0 6px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
  .detail .cols ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .detail .cols li { font: 400 11.5px/1.3 var(--mono); color: var(--ink-2); }
  .detail .cols li::before { content: "\2192 "; color: var(--faint); }
  .detail .none { color: var(--faint); font-style: italic; font-size: 12px; font-family: var(--body); }
  .detail .intro { color: var(--muted); font-size: 13.5px; max-width: 74ch; }
  .detail .intro b { color: var(--ink-2); font-weight: 500; }
  .foot { margin-top: 14px; font-size: 12px; color: var(--faint); }
</style>

<div class="page">
  <div class="toolbar">
    <div class="legend" id="legend"></div>
    <button class="reset" id="reset">Show whole pipeline</button>
  </div>

  <div id="board"><svg id="wires"></svg></div>

  <div class="detail" id="detail">
    <div class="intro" id="intro"></div>
  </div>
</div>

<script src="js/pipeline-map.js"></script>
