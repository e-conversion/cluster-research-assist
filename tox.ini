[tox]
minversion = 4.9.0
envlist =
    lint
    build
    tests

lint_folders =
    "{toxinidir}/src" \
    "{toxinidir}/tests" \
    "{toxinidir}/developer"

[testenv]
passenv = *

[testenv:.pkg]

[testenv:tests]
description = Run the default test suite (no LLM, no PostgreSQL, no slow tests).
setenv =
    PYTHONPATH={toxinidir}/tests
    PYTHONUNBUFFERED=yes
usedevelop = true
deps = -r tests/requirements.txt
commands =
    pytest {posargs}

[testenv:tests-postgres]
description = Run the database tests against PostgreSQL (CRA_TEST_POSTGRES_URL).
setenv = {[testenv:tests]setenv}
usedevelop = true
extras = postgres
deps = -r tests/requirements.txt
commands =
    pytest -m postgres {posargs}

[testenv:tests-llm]
description = Run the tests that call a real LLM endpoint (CRA_LLM_API_KEY, CRA_LLM_BASE_URL, CRA_LLM_MODEL).
setenv = {[testenv:tests]setenv}
usedevelop = true
deps = -r tests/requirements.txt
commands =
    pytest -m llm {posargs}

[testenv:lint]
description = Run linters, type checks and the import-layer check.
package = skip
deps =
    ruff
    mypy
    import-linter
commands =
    ruff format --diff {[tox]lint_folders}
    ruff check {[tox]lint_folders}
    mypy {[tox]lint_folders}
    lint-imports

[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps = ruff
commands =
    ruff format {[tox]lint_folders}
    ruff check --fix-only {[tox]lint_folders} {posargs}

[testenv:build]
description = Assert package build integrity for {platform} with {basepython}.
usedevelop = true
deps =
    build
    check-manifest
    twine
allowlist_externals = bash
commands_pre = python {toxinidir}/developer/clean_dist_check.py
commands =
    python -m build
    twine check dist/*.tar.gz dist/*.whl
    check-manifest {toxinidir}
    bash -c "python -m pip install --force-reinstall dist/cluster_research_assist-*.tar.gz"
    bash -c "python -m pip install --force-reinstall dist/cluster_research_assist-*.whl"
